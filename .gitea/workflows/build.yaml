name: build
on:
  push:
jobs:
  container:
    uses: self:KofTwentyTwo/ci-workflows/.gitea/workflows/container.yaml@v1
    secrets: inherit
    with:
      images: nuncio-website|Dockerfile
      # The Dockerfile runs the install and build; nothing to run before it.
      prebuild: 'true'
      publish-branch: main
      # Deploys: Argo CD Image Updater in cluster-gitops follows the newest image pushed from
      # this branch, so CI needs no GitOps write token.
